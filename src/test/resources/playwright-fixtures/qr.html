<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Fixture qr</title>
  <style>
    .box { position: relative; width: 200px; height: 200px; margin: 24px; }
    .banner { position: absolute; left: 0; right: 0; top: 60px; height: 80px; background: #2a6; }
  </style>
</head>
<body>
<a id="store" href="https://STORE_HOST/app">store page</a>
<div class="box" id="shown">QR_SHOWN</div>
<div class="box" id="hidden" style="display: none">QR_HIDDEN</div>
<div class="box" id="covered">QR_COVERED<div class="banner">cookies</div></div>
<!-- Decorative: square, but nothing a QR library would draw. -->
<svg width="120" height="120" viewBox="0 0 32 32"><rect width="32" height="32" fill="#101010"></rect></svg>
<script>
  history.replaceState(null, '', location.href);
</script>
</body>
</html>
