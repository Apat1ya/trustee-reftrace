# Test stand: the monitor on its daily schedule and Caddy serving a start page, its reports,
# Grafana with the traces and the metrics of the monitor, Prometheus and Alertmanager over HTTPS.
# .github/scripts/deploy.sh copies this directory to the host and writes .env next to it.
#
# The box has 2 GB: Prometheus, Alertmanager and Grafana share up to 650 MB between them, the rest
# is for the monitor and its browsers.

name: reftrace

services:
  reftrace:
    image: ${REFTRACE_IMAGE:?set REFTRACE_IMAGE in .env}
    restart: unless-stopped
    # PID 1 reaper for browsers that outlive their page.
    init: true
    # Chromium keeps its shared memory in /dev/shm; Docker's 64 MB is too small.
    ipc: host
    stop_grace_period: 60s
    environment:
      TZ: UTC
      # No web server yet: keeps the JVM up between scheduled runs.
      SPRING_MAIN_KEEPALIVE: "true"
      REFTRACE_SCHEDULE_ENABLED: "true"
      REFTRACE_SCHEDULE_CRON: ${REFTRACE_SCHEDULE_CRON:-0 0 3 * * *}
      REFTRACE_PARALLELBROWSERS: ${REFTRACE_PARALLEL_BROWSERS:-2}
      REFTRACE_REPORT_OUTPUTDIR: /app/runs
      # No screenshots; the traces of the failed visits are kept for a day, the runs for three.
      # Screenshots are off, so their horizon only has to stay within the run's.
      REFTRACE_REPORT_SCREENSHOTS: "false"
      REFTRACE_REPORT_TRACES: "true"
      REFTRACE_REPORT_RETENTION_RUN: 3d
      REFTRACE_REPORT_RETENTION_SCREENSHOTS: 3d
      REFTRACE_REPORT_RETENTION_TRACES: 1d
      JAVA_TOOL_OPTIONS: ${REFTRACE_JAVA_OPTIONS:-}
      # One trace per page visit, to Tempo inside this network.
      MANAGEMENT_OPENTELEMETRY_TRACING_EXPORT_OTLP_ENDPOINT: http://tempo:4318/v1/traces
      # Its metrics, every minute and once more on the way out, to Prometheus inside this network.
      MANAGEMENT_OTLP_METRICS_EXPORT_ENABLED: "true"
      MANAGEMENT_OTLP_METRICS_EXPORT_URL: http://prometheus:9090/api/v1/otlp/v1/metrics
    volumes:
      - runs:/app/runs
    # The image's check calls the actuator, which the app does not have yet.
    healthcheck:
      disable: true

  # The traces of the visits. No host port: the monitor reaches it inside the network, people
  # through Grafana.
  tempo:
    image: grafana/tempo:2.10.8
    restart: unless-stopped
    command:
      - -config.file=/etc/tempo/tempo.yml
    volumes:
      - ./tempo/tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo-data:/var/tempo

  # The monitor's metrics, pushed over OTLP, and the alert rules on them. Behind Caddy's basic auth
  # at /prometheus/: Caddy takes the prefix off, so inside the network it answers at the root.
  prometheus:
    image: prom/prometheus:v3.5.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Half a year of daily runs; the size bounds it on the small disk first if it has to.
      - --storage.tsdb.retention.time=180d
      - --storage.tsdb.retention.size=1GB
      - --web.enable-otlp-receiver
      - --web.external-url=https://${SITE_ADDRESS}/prometheus/
      - --web.route-prefix=/
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/rules:/etc/prometheus/rules:ro
      - prometheus-data:/prometheus
    mem_limit: 300m
    depends_on:
      - alertmanager

  # The alerts, shown in its UI at /alertmanager/ and sent to Telegram (alertmanager.yml). The
  # deploy writes the bot token and the chat id to secrets/, readable by Alertmanager's user only.
  alertmanager:
    image: prom/alertmanager:v0.34.1
    restart: unless-stopped
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
      - --web.external-url=https://${SITE_ADDRESS}/alertmanager/
      - --web.route-prefix=/
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./secrets/telegram-bot-token:/etc/alertmanager/telegram-bot-token:ro
      - ./secrets/telegram-chat-id:/etc/alertmanager/telegram-chat-id:ro
      - alertmanager-data:/alertmanager
    mem_limit: 50m

  # Behind Caddy's basic auth at /grafana/, so no login of its own: everyone inside is Admin.
  grafana:
    image: grafana/grafana:12.1.0
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: https://${SITE_ADDRESS}/grafana/
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_AUTH_BASIC_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # The run dashboard reads the runs from Caddy (http://caddy:8088) with Infinity. Pinned:
      # Infinity 4 needs Grafana 12.1.7 or later.
      GF_PLUGINS_PREINSTALL_SYNC: yesoreyeram-infinity-datasource@3.11.1
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    mem_limit: 300m
    depends_on:
      - tempo
      - prometheus

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?set SITE_ADDRESS in .env}
      REPORTS_USER: ${REPORTS_USER:-trustee}
      REPORTS_PASSWORD_HASH: ${REPORTS_PASSWORD_HASH:?set REPORTS_PASSWORD_HASH in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site:/srv/site:ro
      - runs:/srv/reports:ro
      - caddy-data:/data
    depends_on:
      - grafana
      - prometheus
      - alertmanager

volumes:
  runs:
  caddy-data:
  tempo-data:
  grafana-data:
  prometheus-data:
  alertmanager-data:
