apiVersion: 1

# The metrics the monitor pushes. The uid is fixed because the monitor dashboard refers to it.
datasources:
  - name: Prometheus
    uid: reftrace-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: false
    jsonData:
      httpMethod: POST
      # The monitor pushes once a minute; finer steps would only repeat the same sample.
      timeInterval: 1m
      manageAlerts: false
